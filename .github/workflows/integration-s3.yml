name: integration-s3
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s3:
    runs-on: ubuntu-latest
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: gateway-test
      S3_TEST_ACCESS_KEY_ID: minioadmin
      S3_TEST_SECRET_ACCESS_KEY: minioadmin
      S3_TEST_REGION: us-east-1
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Install dependencies
        run: bun ci
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_TEST_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_TEST_SECRET_ACCESS_KEY" \
            ghcr.io/coollabsio/minio:latest server /data
          until curl -sf "$S3_TEST_ENDPOINT/minio/health/live"; do sleep 1; done
          curl -sf -X PUT --aws-sigv4 "aws:amz:$S3_TEST_REGION:s3" \
            --user "$S3_TEST_ACCESS_KEY_ID:$S3_TEST_SECRET_ACCESS_KEY" \
            "$S3_TEST_ENDPOINT/$S3_TEST_BUCKET"
      - name: Run S3 integration test
        run: bun test tests/integration
